<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Imagens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .gallery-image {
            height: 220px;
            width: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <main class="container py-5">
        <h1 class="text-center mb-4">Galeria de Imagens</h1>

        <div class="row g-4">

            <div class="col-12 col-md-6 col-lg-4">
                <img src="img/leaoo.jpg" class="img-fluid rounded gallery-image" alt="Leão">
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <img src="img/paisagem.png" class="img-fluid rounded gallery-image" alt="Paisagem">
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <img src="img/passaro.jpg" class="img-fluid rounded gallery-image" alt="Pássaro">
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <img src="img/inspirese.webp" class="img-fluid rounded gallery-image" alt="Mensagem inspiradora">
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <img src="img/leitura.png" class="img-fluid rounded gallery-image" alt="Livro">
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <img src="img/gota.avif" class="img-fluid rounded gallery-image" alt="Gota de água">
            </div>

        </div>
    </main>
</body>
</html>
